    - data:
        type: code
        title: Tipo da manifestação
        code_language: python3
        code: "def main(texto: str) -> dict:\n    \"\"\"Identifica o tipo da manifestação por palavras-chave (as equipes podem melhorar).\"\"\"\n    t = texto.lower()\n    if \"denúnc\" in t or \"denunc\" in t or \"irregular\" in t:\n        tipo = \"denúncia\"\n    elif \"elogi\" in t or \"parabéns\" in t or \"excelente\" in t or \"agradec\" in t:\n        tipo = \"elogio\"\n    elif \"sugest\" in t or \"poderia\" in t or \"sugiro\" in t:\n        tipo = \"sugestão\"\n    else:\n        tipo = \"reclamação\"\n    return {\"tipo\": tipo}\n"
