    - data:
        type: code
        title: Validar número do processo
        code_language: python3
        code: "import re\n\ndef main(texto: str) -> dict:\n    \"\"\"Acha um número de processo no padrão CNJ e confere o dígito verificador (módulo 97).\"\"\"\n    achado = re.search(r\"\\d{7}-?\\d{2}\\.?\\d{4}\\.?\\d\\.?\\d{2}\\.?\\d{4}\", texto)\n    if not achado:\n        return {\"valido\": \"nao\", \"numero\": \"\"}\n    n = re.sub(r\"\\D\", \"\", achado.group(0))\n    base = n[:7] + n[9:20] + \"00\"\n    ok = 98 - int(base) % 97 == int(n[7:9])\n    formatado = f\"{n[:7]}-{n[7:9]}.{n[9:13]}.{n[13]}.{n[14:16]}.{n[16:]}\"\n    return {\"valido\": \"sim\" if ok else \"nao\", \"numero\": formatado}\n"
        variables:
        - variable: texto
          value_selector: *id001
        outputs:
          valido:
            type: string
            children: null
          numero:
            type: string
            children: null
        desc: ''
        selected: false
      id: valida_numero
      position:
        x: 930
        y: 640
      positionAbsolute:
        x: 930
        y: 640
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      height: 90
      width: 244
    - data:
        type: if-else
        title: Número válido?
        cases:
        - case_id: 'true'
          id: 'true'
          logical_operator: and
          conditions:
          - id: c-num-1
            variable_selector:
            - valida_numero
            - valido
            comparison_operator: is
            value: sim
            varType: string
        desc: ''
        selected: false
      id: numero_ok
      position:
        x: 1230
        y: 640
      positionAbsolute:
        x: 1230
        y: 640
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      height: 90
      width: 244
