# Kit IA para Centros de Suporte
# 1) Liga o Dify à rede do kit (conector, ouvidoria e API do tribunal simuladas)
#    e deixa ele enxergar o Ollama do próprio computador (host.docker.internal).
# 2) Guarda os dados do Dify em volumes do Docker, e não em pastas do projeto:
#    no Codespaces, as pastas do projeto podem ter as permissões trocadas e o banco
#    de dados deixa de abrir ("Permission denied").
# 3) Desliga os recursos de "agente" que a disciplina não usa (economizam disco).
# 4) Redis não trava o Dify se uma gravação de segurança falhar (erro MISCONF).
services:
  api:
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [kit-rede]
    volumes: [dify_storage:/app/api/storage]
  api_websocket:
    volumes: [dify_storage:/app/api/storage]
  worker:
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [kit-rede]
    volumes: [dify_storage:/app/api/storage]
  init_permissions:
    volumes: [dify_storage:/app/api/storage]
  db_postgres:
    volumes: [dify_db:/var/lib/postgresql/data]
  redis:
    command: redis-server --requirepass ${REDIS_PASSWORD:-difyai123456} --stop-writes-on-bgsave-error no
    volumes: [dify_redis:/data]
  weaviate:
    volumes: [dify_weaviate:/var/lib/weaviate]
  sandbox:
    volumes: [dify_sandbox_deps:/dependencies]
  plugin_daemon:
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [kit-rede]
    volumes: [dify_plugins:/app/storage]
  ssrf_proxy:
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [kit-rede]
  local_sandbox:
    profiles: [agente]
  agent_ssrf_proxy:
    profiles: [agente]
  nginx:
    networks:
      kit-rede:
        aliases: [dify]

volumes:
  dify_storage:
  dify_db:
  dify_redis:
  dify_weaviate:
  dify_sandbox_deps:
  dify_plugins:

networks:
  kit-rede:
    external: true
