# Kit IA para Centros de Suporte
# Liga o Dify à rede do kit (conector, ouvidoria e API do tribunal simuladas)
# e deixa ele enxergar o Ollama do próprio computador (host.docker.internal).
services:
  api:
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [kit-rede]
  worker:
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [kit-rede]
  plugin_daemon:
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [kit-rede]
  ssrf_proxy:
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [kit-rede]
  # Recursos de "agente" do Dify que a disciplina não usa: ficam desligados
  # (economizam vários GB de disco). Para ligar: COMPOSE_PROFILES=agente
  local_sandbox:
    profiles: [agente]
  agent_ssrf_proxy:
    profiles: [agente]
  nginx:
    networks:
      kit-rede:
        aliases: [dify]

networks:
  kit-rede:
    external: true
